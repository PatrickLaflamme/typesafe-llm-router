# Prefer ModelProvider.list_models() prices when executing (Patrick lock 2026-09-17).
# Cursor snapshot: https://cursor.com/docs/models-and-pricing (2026-09-17).
# Units: USD per million tokens (MTok).
#
# Load with: typesafe-llm-router route --catalog config/models.example.toml ...

[models."composer-2.5"]
