# Illustrative cost / cache / tier table — replace with your real provider rates.
# Paper policy: docs/decision-rules.md (T-small | T-mid | T-frontier bands).
# Units: USD per million tokens (MTok). Bands are placeholders, not live quotes.
#
# Load with: typesafe-llm-router route --catalog config/models.example.toml ...

[models.gpt-4o-mini]
id = "gpt-4o-mini"
tier = "T-small"
tool_capable = true
cache_eligible = true
input_usd_per_mtok = 0.15
output_usd_per_mtok = 0.60
cost_band_in = "$0.05–0.20"
cost_band_out = "$0.20–0.80"
cache_read_usd_per_mtok = 0.075
cache_write_usd_per_mtok = 0.375
notes = "T-small; prompt-cache friendly for long sessions."

