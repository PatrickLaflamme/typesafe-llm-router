[package]
name = "typesafe-llm-router"
version = "0.1.0"
edition = "2021"
description = "Low-latency LLM session router driven by TypeSafe System One (Choice)"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["llm", "router", "typesafe", "caching", "cost"]
categories = ["command-line-utilities", "api-bindings"]

[lib]
name = "typesafe_llm_router"
path = "src/lib.rs"

[[bin]]
name = "typesafe-llm-router"
path = "src/bin/router.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
pretty_assertions = "1"
